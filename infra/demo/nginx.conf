# Gateway do ambiente de demonstração. Os servidores ficam em gateway.conf.template
# (a imagem do nginx substitui ${DEMO_EXPIRES} e grava o resultado em /etc/nginx/conf.d).
events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off; # a aplicação já emite access log estruturado com correlationId

  # DNS interno do Docker: proxy_pass por variável re-resolve as 3 réplicas de `app`.
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Só o arquivo da demo: o default.conf da imagem fica de fora.
  include /etc/nginx/conf.d/gateway.conf;
}
