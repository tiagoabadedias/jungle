# Gateway para `docker compose up --scale app=N`: distribui as requisições entre as réplicas.
events {}

http {
  # DNS interno do Docker. O proxy_pass via variável força a re-resolução de `app` (sem isso o
  # nginx fixaria o IP da primeira réplica no boot); com várias réplicas, alterna entre os IPs.
  resolver 127.0.0.11 valid=5s ipv6=off;

  access_log off; # a aplicação já emite access log estruturado com correlationId

  server {
    listen 80;
    include /etc/nginx/snippets/app-proxy.conf; # /docs (Swagger UI) e / (aplicação)
  }
}
