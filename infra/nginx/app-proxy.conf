# Rotas comuns aos gateways local (infra/nginx/nginx.conf) e da demo (infra/demo/gateway.conf.template).
# Montado em /etc/nginx/snippets/ e incluído no server da porta 80.

# Página de estrutura (docs/architecture-overview.html): camadas, domínio, dados, fluxos e falhas.
location = /arquitetura {
  default_type "text/html; charset=utf-8";
  alias /usr/share/nginx/docs/architecture-overview.html;
}

# Swagger UI. No ambiente local (perfil `tools`), sem o perfil ativo só esta rota responde 502.
location /docs {
  set $docs_upstream http://swagger-ui:8080;
  proxy_pass $docs_upstream;
  proxy_set_header Host $host;
}

# Todo o resto vai para a aplicação, sem filtro: API, /health/*, /metrics.
location / {
  set $app_upstream http://app:3000;
  proxy_pass $app_upstream;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_next_upstream off; # nunca reenvia uma requisição financeira para outra réplica
  proxy_read_timeout 30s;
}
